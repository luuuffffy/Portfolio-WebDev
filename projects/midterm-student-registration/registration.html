<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registration | My Personal Website</title>
  <link rel="stylesheet" href="style.css"/>
</head>

<body>

  <header>
    <h1>Student Registration</h1>
    <p>Please fill out the form below with your personal information to complete your student registration.</p>
  </header>

  <nav>
    <a href="index.html">Home</a>
    <a href="registration.html" class="active">Registration</a>
    <a href="grades.html">Grades</a>
    <a href="profile.html">Profile</a>
  </nav>

  <main>
    <section>
      <form class="registration-form" action="#" method="post">
        <h2>Student Registration Form</h2>

        <label for="student-name">Student Name</label>
        <input type="text" id="student-name" name="student-name" placeholder="Enter Name" required />

        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="Enter Email" required />

        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter Password" required />

        <fieldset class="radio-group">
          <legend>Gender</legend>
          <label><input type="radio" name="gender" value="male" /> Male</label>
          <label><input type="radio" name="gender" value="female" /> Female</label>
        </fieldset>

        <label for="course">Course</label>
        <select id="course" name="course" required>
          <option value="" selected disabled>Select Course</option>
          <option value="bscs">BSCS</option>
          <option value="bsit">BSIT</option>
          <option value="bsoa">BSOA</option>
          <option value="bsentrep">BSENTREP</option>
          <option value="bstm">BSTM</option>
          <option value="bshm">BSHM</option>
          <option value="beced">BECED</option>
          <option value="btled">BTLED</option>
        </select>

        <fieldset class="checkbox-group">
          <legend>Skills</legend>
          <label><input type="checkbox" name="skills" value="html" /> HTML</label>
          <label><input type="checkbox" name="skills" value="css" /> CSS</label>
          <label><input type="checkbox" name="skills" value="javascript" /> JavaScript</label>
        </fieldset>

        <label for="profile-picture">Profile Picture</label>
        <input type="file" id="profile-picture" name="profile-picture" />

        <label for="address">Address</label>
        <textarea id="address" name="address" rows="4"></textarea>

        <button type="submit">Submit</button>
        <button type="reset" class="reset-btn">Reset</button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; .2026.Jeremy.</p>
  </footer>

</body>
</html>
